async function loadLogo() {
  try {
    const r = await fetch('/logo-ideaforma.png'); const b = await r.blob();
    LOGO = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(b); });
  } catch (e) { log('logo introuvable : ' + e.message); }
}
