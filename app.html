<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ideaforma — Gestion</title>

  <!-- ─── PWA ─── -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#FDF6F4" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1B1418" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="Dossiers OPCO, agenda, tâches, notes et documents au même endroit." />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Mymy" />
  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/vie.css" />
  <link rel="stylesheet" href="css/bujo.css" />
  <link rel="stylesheet" href="css/crystal.css" />
</head>
<body>
  <div class="app-layout" id="appLayout">

    <!-- ─── SIDEBAR ─── -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <img src="logomymy.png" alt="Mymy"
             onerror="this.style.display='none'; document.getElementById('sidebar-logo-fallback').style.display='flex';" />
        <div class="sidebar-logo-fallback" id="sidebar-logo-fallback" style="display:none;">
          <div class="logo-icon">I</div>
          <div>
            <div class="logo-name">Ideaforma</div>
            <div class="logo-tagline">Organisme Qualiopi</div>
          </div>
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebarNav">

        <div class="nav-item active" data-page="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>
          </svg>
          Tableau de bord
        </div>

        <div class="nav-item" data-page="agenda">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          Agenda
          <span id="navAgendaBadge" class="nav-badge" style="display:none;"></span>
        </div>

        <div class="nav-item" data-page="taches">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 11 12 14 22 4"/>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
          </svg>
          Tâches
          <span id="navTachesBadge" class="nav-badge" style="display:none;"></span>
        </div>

        <div class="nav-item" data-page="notes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="8" y1="13" x2="15" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/>
          </svg>
          Pense-bête
        </div>

        <div class="nav-item" data-page="coffre">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="12" cy="12" r="3.5"/><path d="M12 8.5V7"/><path d="M15.5 12H17"/>
          </svg>
          Coffre
        </div>

        <div class="nav-section">Formation</div>

        <div class="nav-item" data-page="journee">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/>
          </svg>
          Ma journée
          <span id="navJourneeBadge" class="nav-badge" style="display:none;"></span>
        </div>

        <div class="nav-item" data-page="activite">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/>
            <line x1="6" y1="20" x2="6" y2="14"/>
          </svg>
          Activité OPCO
        </div>

        <div class="nav-item" data-page="opco_commerce">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          OPCO Commerce
          <span class="nav-dot nav-dot-commerce" data-opco="opco_commerce"></span>
        </div>

        <div class="nav-item" data-page="opco_mobilite">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="1" y="3" width="15" height="13" rx="1"/>
            <path d="M16 8h4l3 3v5h-7V8z"/>
            <circle cx="5.5" cy="18.5" r="2.5"/>
            <circle cx="18.5" cy="18.5" r="2.5"/>
          </svg>
          OPCO Mobilité
          <span class="nav-dot nav-dot-mobilite" data-opco="opco_mobilite"></span>
        </div>

        <div class="nav-item" data-page="akto">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          AKTO
          <span class="nav-dot nav-dot-akto" data-opco="akto"></span>
        </div>

        <div class="nav-item" data-page="constructys">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="12 2 2 7 12 12 22 7 12 2"/>
            <polyline points="2 17 12 22 22 17"/>
            <polyline points="2 12 12 17 22 12"/>
          </svg>
          Constructys
          <span class="nav-dot nav-dot-constructys" data-opco="constructys"></span>
        </div>

        <div class="nav-item" data-page="opco_ep">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
          OPCO EP
          <span class="nav-dot nav-dot-ep" data-opco="opco_ep"></span>
        </div>

        <div class="nav-section">Développement</div>

        <div class="nav-item" data-page="parcours">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
          </svg>
          Parcours CFA &amp; EDOF
        </div>

        <div class="nav-section">Compte</div>

        <div class="nav-item" data-page="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33
              1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06
              a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09
              A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68
              a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06
              a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09
              a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          Paramètres
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="user-row">
          <div class="user-avatar" id="userAvatar">A</div>
          <div>
            <div class="user-name" id="userName">Administrateur</div>
            <div class="user-role">Gestionnaire</div>
          </div>
        </div>
        <button class="btn-logout" id="logoutBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Se déconnecter
        </button>
      </div>
    </aside>

  <!-- ─── MOBILE BACKDROP ─── -->
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- ─── MAIN ─── -->
    <main class="main-content">
      <header class="page-header" id="pageHeader">
        <div class="header-start">
          <button class="hamburger" id="hamburgerBtn" aria-label="Ouvrir le menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="6" x2="21" y2="6"/>
              <line x1="3" y1="12" x2="21" y2="12"/>
              <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
          <div class="page-header-left">
            <div class="page-title" id="pageTitle">Tableau de bord</div>
            <div class="page-subtitle" id="pageSubtitle">Vue d'ensemble</div>
          </div>
        </div>
        <div class="header-end">
          <div id="pageHeaderRight"></div>
          <button class="dark-toggle" id="darkToggle" aria-label="Basculer mode sombre">
            <svg id="iconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"/>
              <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
              <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
            <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </button>
        </div>
      </header>

      <div class="page-body" id="pageContent">
        <!-- Injected by JS -->
      </div>
    </main>

  </div>

  <!-- ─── MODAL ─── -->
  <div class="modal-overlay" id="modalOverlay" style="display:none">
    <div class="modal" id="modal">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">Titre</div>
        <button class="modal-close" id="modalClose">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <!-- ─── TOAST ─── -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ─── SCRIPTS ─── -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="js/icones.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/data.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/journee.js"></script>
  <script src="js/opco.js"></script>
  <script src="js/documents.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/vie.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/hub.js"></script>
  <script src="js/parcours.js"></script>
  <script src="js/taches.js"></script>
  <script src="js/agenda.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/coffre.js"></script>
  <script src="js/assistant.js"></script>
  <script src="js/app.js"></script>
  <script src="js/install.js"></script>
</body>
</html>
